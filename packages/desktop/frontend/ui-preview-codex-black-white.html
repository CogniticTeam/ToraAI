<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoCode · Codex 风格预览</title>
  <style>
    :root{--ink:#1b1b19;--paper:#fff;--sidebar:#f5f5f4;--line:#e6e6e2;--muted:#858580;--active:#e9e9e6;--r:10px}*{box-sizing:border-box}body{margin:0;min-width:980px;background:var(--paper);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.app{display:grid;grid-template-columns:288px minmax(0,1fr);height:100vh}.sidebar{display:flex;flex-direction:column;padding:20px 12px 12px;background:var(--sidebar);border-right:1px solid var(--line)}.brand{padding:6px 10px 22px;font-size:20px;font-weight:650;letter-spacing:-.04em}.nav,.history{display:grid;gap:2px}.nav button,.history button{height:35px;border:0;border-radius:8px;padding:0 10px;background:transparent;color:#51514d;text-align:left;font:inherit}.nav button:hover,.history button:hover,.history .active{background:var(--active);color:var(--ink)}.nav button{font-weight:560}.section{padding:26px 10px 8px;color:#9a9a95;font-size:11px;font-weight:600}.account{display:flex;gap:9px;align-items:center;margin-top:auto;padding:13px 9px 0;border-top:1px solid var(--line)}.avatar{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:#1b1b19;color:white;font-size:11px}.account span{color:var(--muted);font-size:11px}.main{display:flex;min-width:0;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 26px;border-bottom:1px solid var(--line);font-weight:570}.top span{color:var(--muted);font-weight:400}.tools{display:flex;gap:8px}.tools button,.turn-actions button{border:0;border-radius:7px;background:transparent;color:#696965}.tools button{width:30px;height:30px}.tools button:hover,.turn-actions button:hover{background:#f0f0ed;color:var(--ink)}.content{width:min(860px,calc(100% - 96px));margin:0 auto;flex:1;padding:42px 0;overflow:auto}.label{color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}h1{margin:8px 0 36px;font-size:24px;letter-spacing:-.035em}.message{margin:0 0 30px}.meta{margin-bottom:10px;color:#74746f;font-size:12px}.user{display:inline-block;max-width:610px;padding:12px 14px;border:1px solid #ddddda;border-radius:var(--r);background:#fff;line-height:1.6}.answer{max-width:710px;line-height:1.75}.answer p{margin:0 0 12px}.code{margin-top:14px;padding:13px 15px;border-radius:var(--r);background:#1d1d1b;color:#ebebe7;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}.turn-actions{display:flex;gap:4px;margin-top:8px}.turn-actions button{width:25px;height:25px}.composer-wrap{padding:16px 28px 21px;background:linear-gradient(0deg,#fff 88%,rgba(255,255,255,0))}.composer{display:flex;align-items:center;gap:10px;width:min(860px,100%);min-height:58px;margin:auto;padding:8px 8px 8px 14px;border:1px solid #d3d3cf;border-radius:12px;background:white;box-shadow:0 8px 26px rgba(0,0,0,.045)}.placeholder{flex:1;color:#a1a19b}.actions{display:flex;align-items:center;gap:3px}.actions button{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#666660;font-size:16px}.actions button:hover{background:#efefec}.actions .send{width:38px;height:38px;color:white;background:#1b1b19;font-size:20px}.note{margin:8px auto 0;width:min(860px,100%);color:#aaa9a4;text-align:center;font-size:10.5px}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar"><div class="brand">CoCode</div><div class="nav"><button>✎　新对话</button><button>⌘　工作区</button><button>◷　定时任务</button><button>◈　技能中心</button></div><div class="section">项目</div><div class="history"><button>▱　CoCode</button><button class="active">　优化整体 UI 与排版</button><button>　修复语音输入体验</button><button>　设计技能导入流程</button></div><div class="account"><div class="avatar">J</div><div><b>Jason</b><br><span>个人工作区</span></div></div></aside>
    <main class="main"><header class="top">▱　优化整体 UI 与排版 <div class="tools"><button>···</button><button>⇧ 分享</button><button>☷</button></div></header><section class="content"><div class="label">SESSION · 12:10</div><h1>优化整体 UI 与排版</h1><article class="message"><div class="meta">你</div><div class="user">优化整体 UI 与排版，对齐 CodeX，并且配色改为黑白配色。</div></article><article class="message"><div class="meta">CoCode</div><div class="answer"><p>界面已按 Codex 的阅读优先结构调整：浅灰导航侧栏、白色主内容区与更克制的边框层级。</p><p>黑白灰取代所有品牌渐变；输入区域保持稳定在底部，右侧工具区保持清晰且不影响阅读。</p><div class="code">surface = white / neutral gray<br>primary = #191919<br>radius = 10px</div></div><div class="turn-actions"><button>↻</button><button>□</button><button>⋯</button></div></article></section><footer class="composer-wrap"><div class="composer"><span class="placeholder">随心输入</span><div class="actions"><button>＋</button><button>⌇</button><button>♩</button><button class="send">↑</button></div></div><div class="note">CoCode 可能会出错，请核对重要信息。</div></footer></main>
  </div>
</body>
</html>
