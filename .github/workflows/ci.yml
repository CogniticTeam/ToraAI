name: Verify Tora

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-api:
    name: Core and API regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Keep private website files out of the open-source repository
        run: |
          npm run verify:public-source
          git fetch --unshallow --tags || git fetch --tags
          node scripts/test-public-source-boundary.mjs --history
      - run: npm ci --prefix packages/desktop/frontend
      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --workspaces --audit-level=high
      - name: Generate CycloneDX software bill of materials
        run: |
          mkdir -p artifacts
          npm sbom --sbom-format cyclonedx --package-lock-only > artifacts/tora.cdx.json
          node -e "const s=require('./artifacts/tora.cdx.json'); if (s.bomFormat !== 'CycloneDX' || !Array.isArray(s.components) || !s.components.length) process.exit(1); console.log('SBOM verified:', s.specVersion, s.components.length, 'components')"
      - name: Preserve SBOM for release and security review
        uses: actions/upload-artifact@v4
        with:
          name: tora-sbom-${{ github.sha }}
          path: artifacts/tora.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Run deterministic core and ASAPI regression suite
        # Bash sandbox coverage requires the OS namespace tool on this ephemeral runner.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev-bind /dev /dev --proc /proc true
          npm test
      - name: Verify code-review regression cases
        run: npm run test:review
      - name: Verify recorded changes in non-Git workspaces
        run: node --test packages/core/test/session-diff.test.mjs packages/core/test/builtin-quota.test.mjs packages/core/test/shared-work-history.test.mjs packages/core/test/web-preview.test.mjs
      - name: Verify ToChat built-in models and reasoning transport
        run: npm run test:tochat
      - name: Verify localized first-message naming
        run: node --test packages/core/test/title-languages.test.mjs
      - name: Verify isolated work-execution evaluation fixtures
        run: npm run eval:baseline
      - name: Verify desktop navigation security policy
        run: npm run test:desktop-security
      - name: Verify model-provider protocols without real credentials
        run: |
          npm run test:providers
          node --test packages/core/test/model-transport.test.mjs

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/desktop/frontend/package-lock.json
      - run: npm ci --prefix packages/desktop/frontend
      - name: Lint desktop frontend
        run: npm --prefix packages/desktop/frontend run lint
      - name: Type-check and build desktop frontend
        run: npm --prefix packages/desktop/frontend run build

  ui-smoke:
    name: Browser UI smoke
    runs-on: ubuntu-latest
    needs: frontend-build
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/desktop/frontend
      - name: Install CJK fonts for screenshot verification
        timeout-minutes: 3
        run: sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 && sudo apt-get install -y fonts-noto-cjk
      - name: Build SPA served by the isolated ASAPI test server
        run: npm --prefix packages/desktop/frontend run build
      - name: Enforce initial-load bundle budget
        run: npm run test:bundle
      - name: Profile official model picker with a long synthetic conversation
        env:
          TORA_CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/test-official-picker-performance.mjs
      - name: Verify login-gated task shell in headless Chrome
        env:
          TORA_CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:ui
      - name: Verify ToCode built-in model selection and first-message routing
        env:
          TORA_CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/test-tocode-builtin-ui.mjs
      - name: Verify subscription checkout and percentage usage
        env:
          TORA_CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/test-subscription-ui.mjs
      - name: Verify theme fonts, preview and persistence
        env:
          TORA_CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/test-theme-background-ui.mjs
      - name: Verify critical chat and composer interactions
        env:
          TORA_CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:ui:critical
      - name: Save subscription interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subscription-ui-screenshots
          path: |
            /tmp/tora-subscriptions-ui.png
            /tmp/tora-account-usage-menu.png
            /tmp/tora-quota-settings.png
            /tmp/tora-model-picker.png
            /tmp/tora-thinking-menu-edges.png
            /tmp/tora-chat-composer-multiline.png
            /tmp/tora-doubao-chat-picker.png
            /tmp/tora-official-picker-performance.json
            /tmp/tora-web-preview-sidebar.png
            /tmp/tora-theme-font-settings.png
            /tmp/tora-settings-without-debug.png
            /tmp/tora-custom-background-dark.png
          if-no-files-found: ignore
          retention-days: 7

  system-fonts:
    name: System fonts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/test-system-fonts.mjs scripts/test-font-preference.mjs
