name: Verify CoCode

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-api:
    name: Core and API regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --workspaces --audit-level=high
      - name: Generate CycloneDX software bill of materials
        run: |
          mkdir -p artifacts
          npm sbom --sbom-format cyclonedx --package-lock-only > artifacts/cocode.cdx.json
          node -e "const s=require('./artifacts/cocode.cdx.json'); if (s.bomFormat !== 'CycloneDX' || !Array.isArray(s.components) || !s.components.length) process.exit(1); console.log('SBOM verified:', s.specVersion, s.components.length, 'components')"
      - name: Preserve SBOM for release and security review
        uses: actions/upload-artifact@v4
        with:
          name: cocode-sbom-${{ github.sha }}
          path: artifacts/cocode.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Run deterministic core and ASAPI regression suite
        run: npm test
      - name: Verify desktop navigation security policy
        run: npm run test:desktop-security

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/desktop/frontend/package-lock.json
      - run: npm ci --prefix packages/desktop/frontend
      - name: Lint desktop frontend
        run: npm --prefix packages/desktop/frontend run lint
      - name: Type-check and build desktop frontend
        run: npm --prefix packages/desktop/frontend run build

  ui-smoke:
    name: Browser UI smoke
    runs-on: ubuntu-latest
    needs: frontend-build
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/desktop/frontend
      - name: Build SPA served by the isolated ASAPI test server
        run: npm --prefix packages/desktop/frontend run build
      - name: Enforce initial-load bundle budget
        run: npm run test:bundle
      - name: Verify login-gated task shell in headless Chrome
        env:
          COCODE_CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:ui
