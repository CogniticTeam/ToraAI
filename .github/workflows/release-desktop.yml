name: Transfer verified macOS release assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify website copies and attach the notarized macOS release files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.1.2 --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish | jq -e '.isDraft and .targetCommitish == "13d59796d02a872160a09dad2e7efed65c217008"'
          curl --fail --silent --show-error --retry 2 --connect-timeout 20 --max-time 300 \
            'https://toraai.cogniticteam.com/downloads/v1.1.2/Tora-1.1.2-mac.dmg' --output 'Tora-1.1.2-mac.dmg'
          printf '%s  %s\n' '42859f16dea38067c6e3db4e2c63522cea2c3b3d187783b866c3330fd0649ba5' 'Tora-1.1.2-mac.dmg' | sha256sum -c -
          test "$(stat -c %s 'Tora-1.1.2-mac.dmg')" = '238147713'
          curl --fail --silent --show-error --retry 2 --connect-timeout 20 --max-time 300 \
            'https://toraai.cogniticteam.com/downloads/v1.1.2/Tora-1.1.2-mac.zip' --output 'Tora-1.1.2-mac.zip'
          printf '%s  %s\n' '1281f2f7e5e4f17ce47573bcd4e7f3ac9d03f89e2a56523a8b3264e8b5da5a07' 'Tora-1.1.2-mac.zip' | sha256sum -c -
          test "$(stat -c %s 'Tora-1.1.2-mac.zip')" = '237494355'
          gh release upload v1.1.2 Tora-1.1.2-mac.dmg Tora-1.1.2-mac.zip --repo "$GITHUB_REPOSITORY"
