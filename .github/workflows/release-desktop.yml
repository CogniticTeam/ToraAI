name: Transfer verified Windows release asset
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  release-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tora-windows-1.1.2
          run-id: 44670707858
          github-token: ${{ github.token }}
          path: staging
      - name: Verify and attach the validated installer to the release draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'b1b293f8b8bdc4867009b2ca960e1e091352b46ff20fc85fb51a24b48a1ba66a' 'staging/Tora-1.1.2-win-x64.exe' | sha256sum -c -
          gh release view v1.1.2 --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish | jq -e '.isDraft and .targetCommitish == "13d59796d02a872160a09dad2e7efed65c217008"'
          gh release upload v1.1.2 staging/Tora-1.1.2-win-x64.exe --repo "$GITHUB_REPOSITORY"
