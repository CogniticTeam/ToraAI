name: "🐛 Bug 反馈"
description: "界面、模型、工具调用、账号或其他功能异常。"
title: "[Bug]: "
labels: ["新提交", "bug"]
body:
  - type: markdown
    attributes:
      value: "提交前请阅读 [Issues 提交注意事项](https://github.com/CognitictTeam/ToraAI/blob/main/.github/ISSUE_GUIDELINES.md)。English reports are welcome."
  - type: checkboxes
    id: checks
    attributes:
      label: "提交前确认"
      options:
        - label: "我已搜索已有议题，本次只报告一个可单独追踪的问题。"
          required: true
        - label: "我已核对当前版本；如使用旧版本，会说明原因。"
          required: true
        - label: "截图和日志已移除 API Key、令牌、账号信息及私有内容。"
          required: true
  - type: input
    id: version
    attributes:
      label: "应用版本 / Version"
      placeholder: "例如 v1.0.2；源码版请提供 commit。"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: "操作系统"
      options: ["macOS", "Windows", "Linux（CLI / 源码）", "其他"]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: "发生问题的模式"
      options: ["ToCode", "ToChat — 聊天", "ToChat — 工作", "CLI", "其他 / 不确定"]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "问题与预期结果"
      description: "说明实际发生了什么，以及你期待的行为。不要只写“不能用”。"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "最小复现步骤 / Steps to reproduce"
      placeholder: "1. 打开哪个页面\n2. 输入或选择什么\n3. 哪一步出现异常"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "环境与模型信息"
      description: "操作系统版本、芯片/架构；如涉及模型，提供服务商、模型名、官方/自定义来源和非敏感错误码。不要提供密钥、完整私有端点或私人提示词。"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "错误信息、日志或截图"
      description: "可拖入已脱敏的附件。如果没有日志，请说明无法获取的原因并尽量提供截图或准确错误文字。"
    validations:
      required: true
