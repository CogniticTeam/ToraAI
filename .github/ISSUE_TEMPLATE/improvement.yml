name: "🛠 优化建议"
description: "改进已有功能的性能、易用性、无障碍或文案。"
title: "[优化]: "
labels: ["新提交", "enhancement"]
body:
  - type: markdown
    attributes:
      value: "请阅读 [提交注意事项](https://github.com/CognitictTeam/ToraAI/blob/main/.github/ISSUE_GUIDELINES.md)。新增能力请使用新功能提案，异常行为请使用 Bug 反馈。English suggestions are welcome."
  - type: checkboxes
    id: checks
    attributes:
      label: "提交前确认"
      options:
        - label: "我已搜索现有建议，本次只讨论一个具体改进。"
          required: true
        - label: "我的建议包含实际使用场景和可检查的改进目标。"
          required: true
        - label: "我理解维护者会按影响范围与开发成本安排优先级。"
          required: true
  - type: textarea
    id: current
    attributes:
      label: "当前功能与使用体验"
      description: "标明页面、功能、版本和当前操作方式。性能建议可附耗时、资源占用或录屏。"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: "建议如何调整"
      description: "描述调整前后的差异，尽量保留原有流程和兼容性。"
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: "改进目标与理由"
      description: "预计减少哪些步骤、等待时间或使用障碍？如何验证改善？"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "截图、数据或参考链接（可选）"
      description: "提供与建议直接相关的证据，先移除密钥、私人会话和账户信息。"
